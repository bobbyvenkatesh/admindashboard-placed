          </div>
        </div>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:"-0.02em",color:"var(--ink)"}}>PLACED</div>
        <div style={{fontSize:12,color:"var(--ink-soft)",fontWeight:600,letterSpacing:".05em",textTransform:"uppercase",marginTop:3}}>Placement & Assessment Intelligence</div>
        
        <div style={{margin:"24px 0",padding:16,background:"var(--surface-alt)",borderRadius:14,display:"flex",alignItems:"center",gap:12,textAlign:"left"}}>
          <div className="avatar" style={{width:40,height:40,fontSize:13}}>AD</div>
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontWeight:700,fontSize:13,color:"var(--ink)"}}>Placement Admin</div>
            <div style={{fontSize:11.5,color:"var(--ink-soft)"}}>admin@placement.edu</div>
          </div>
          <span className="pill pill-good" style={{fontSize:10}}>Signed Out</span>
        </div>

        <button className="btn btn-brand" style={{width:"100%",justifyContent:"center",padding:"12px 18px",fontSize:14}} onClick={handleSignIn} disabled={signingIn}>
          <Icon name="log-out" size={16} color="#fff" style={{transform:"rotate(180deg)"}}/>
          {signingIn ? "Resuming Session..." : "Sign In to Admin Dashboard"}
        </button>
        <div style={{marginTop:16,fontSize:11.5,color:"var(--ink-faint)"}}>
          Infinite Possibilities, Definite Outcome.
        </div>
      </div>
    </div>
  );
}

function SettingsView({isSupabaseConnected, openConnectModal, onLogoutClick}){
  const toast = useToast();
  const [orgName, setOrgName] = useState(localStorage.getItem("placed_org_name") || "Placement Directorate");
  const [email, setEmail] = useState(localStorage.getItem("placed_org_email") || "admin@placement.edu");
  const [threshold, setThreshold] = useState(localStorage.getItem("placed_risk_threshold") || "55");

  const saveSettings = ()=>{
    localStorage.setItem("placed_org_name", orgName);
    localStorage.setItem("placed_org_email", email);
    localStorage.setItem("placed_risk_threshold", threshold);
    toast("Organization settings saved.");
  };

  return (
    <div>
      <div className="page-head"><div><div className="page-title">Settings & Cloud Setup</div><div className="page-desc">Organization preferences, database credentials, and alert triggers</div></div></div>
      <div className="grid grid-2" style={{marginBottom:16}}>
        <SectionCard title="Cloud Database Connection (Supabase)">
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span className={"conn-badge " + (isSupabaseConnected ? "live" : "offline")} style={{margin:0}}>
                <span className="conn-dot"></span>
                <span>{isSupabaseConnected ? "Connected to PostgreSQL" : "Not Connected"}</span>
              </span>
            </div>
            <div style={{fontSize:12.5,color:"var(--ink-soft)",lineHeight:1.5}}>
              Connect your Supabase project to enable live cloud persistence, realtime synchronization, and multi-device access.
            </div>
            <button className="btn btn-brand" style={{width:"fit-content"}} onClick={openConnectModal}>
              <Icon name="database" size={15} color="#fff"/> {isSupabaseConnected ? "Manage Supabase Connection" : "Connect Supabase Database"}
            </button>
          </div>
        </SectionCard>

        <SectionCard title="Admin Profile & Active Session">
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div className="avatar" style={{width:42,height:42,fontSize:14}}>AD</div>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>Placement Admin</div>
                <div style={{fontSize:12,color:"var(--ink-soft)"}}>admin@placement.edu · HQ Super Administrator</div>
              </div>
            </div>
            <div style={{fontSize:12.5,color:"var(--ink-soft)",lineHeight:1.5}}>
              You are signed in with executive administrative access. You can safely sign out of this workstation below.
            </div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn btn-ghost btn-sm" style={{color:"var(--bad)",borderColor:"rgba(239,68,68,0.3)"}} onClick={onLogoutClick}>
                <Icon name="log-out" size={14} color="var(--bad)"/> Log out of session
              </button>
            </div>
          </div>
        </SectionCard>
      </div>

      <SectionCard title="Organization profile">
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div><label className="field-label">Organization name</label><input className="field-input" placeholder="e.g. Placement Directorate" value={orgName} onChange={e=>setOrgName(e.target.value)}/></div>
            <div><label className="field-label">Primary contact email</label><input className="field-input" placeholder="e.g. admin@institution.edu" value={email} onChange={e=>setEmail(e.target.value)}/></div>
          </div>
          <div style={{display:"flex",gap:12}}>
            <div style={{flex:1}}><label className="field-label">Time zone</label><select className="field-input"><option>Asia/Kolkata (IST)</option><option>UTC</option><option>America/New_York (EST)</option></select></div>
            <div style={{flex:1}}><label className="field-label">Risk threshold score</label><input className="field-input" value={threshold} onChange={e=>setThreshold(e.target.value)}/></div>
          </div>
          <button className="btn btn-primary" style={{width:"fit-content"}} onClick={saveSettings}>Save changes</button>
        </div>
      </SectionCard>
    </div>
  );
}

/* ============================== APP ROOT ============================== */
function App(){
  const toast = useToast();
  const [view,setView] = useState("dashboard");
  const [sidebarOpen,setSidebarOpen] = useState(false);
  const [modal,setModal] = useState(null);
  const [selectedStudent, setSelectedStudent] = useState(null);
  const [isSearchOpen, setIsSearchOpen] = useState(false);
  const [selectedInst, setSelectedInst] = useState("All");
  const [filterRisk, setFilterRisk] = useState("All");

  // Pure live state collections
  const [institutions, setInstitutions] = useState([]);
  const [students, setStudents] = useState([]);
  const [drives, setDrives] = useState([]);
  const [assessments, setAssessments] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [studyModules, setStudyModules] = useState(() => {
    try {
      const local = localStorage.getItem("placed_study_modules");
      return local ? JSON.parse(local) : [];
    } catch(e) {
      return [];
    }
  });
  const [isSupabaseConnected, setIsSupabaseConnected] = useState(Boolean(supabase));

  // Dynamically derived list of departments
  const departments = useMemo(()=> Array.from(new Set(students.map(s=>s.department).filter(Boolean))), [students]);

  // Global Keyboard shortcuts: Cmd+K / Ctrl+K
  useEffect(()=>{
    const handleKeyDown = (e)=>{
      if((e.metaKey || e.ctrlKey) && e.key==="k"){
        e.preventDefault();
        setIsSearchOpen(v=>!v);
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return ()=> window.removeEventListener("keydown", handleKeyDown);
  },[]);

  // Fetch data from Supabase
  const loadCloudData = useCallback(async ()=>{
    if(!supabase) return;
    try {
      const [instRes, studRes, driveRes, assRes, notifRes, smRes] = await Promise.all([
        supabase.from("admin_institutions").select("*").order("created_at", {ascending:false}),
        supabase.from("admin_students").select("*").order("created_at", {ascending:false}),
        supabase.from("admin_placement_drives").select("*").order("created_at", {ascending:false}),
        supabase.from("admin_assessments").select("*").order("created_at", {ascending:false}),
        supabase.from("admin_notifications").select("*").order("created_at", {ascending:false}),
        supabase.from("study_modules").select("*").order("created_at", {ascending:false}),
      ]);

      if(instRes.data) setInstitutions(instRes.data);
      if(studRes.data) setStudents(studRes.data);
      if(driveRes.data) setDrives(driveRes.data);
      if(assRes.data) setAssessments(assRes.data);
      if(notifRes.data) setNotifications(notifRes.data);
      if(smRes && smRes.data && smRes.data.length > 0) {
        const parsed = smRes.data.map(r => {
          let meta = {};
          try { meta = typeof r.description === 'string' && r.description.startsWith('{') ? JSON.parse(r.description) : {}; } catch(e){}
          return {
            id: r.id,
            title: r.title,
            subject: r.subject || meta.main_topic || "Quantitative Aptitude / Mathematics",
            fileName: meta.file_name || r.title,
            fileSize: meta.file_size || 0,
            fileType: meta.file_type || "Document",
            fileData: meta.file_data || null,
            createdAt: r.created_at ? new Date(r.created_at).toLocaleDateString("en-GB", {day:"2-digit",month:"short",year:"numeric"}) : "Just now"
          };
        });
        setStudyModules(prev => {
          const ids = new Set(parsed.map(p=>p.id));
          const merged = [...parsed, ...prev.filter(p => !ids.has(p.id))];
          localStorage.setItem("placed_study_modules", JSON.stringify(merged));
          return merged;
        });
      }
      setIsSupabaseConnected(true);
    } catch(err){
      console.error("Error loading cloud data:", err);
    }
  },[]);

  // Setup Supabase Realtime Channels
  useEffect(()=>{
    loadCloudData();

    if(supabase){
      const channel = supabase.channel("realtime-dashboard")
        .on("postgres_changes", { event: "*", schema: "public" }, () => {
          loadCloudData();
        })
        .subscribe();

      return () => {
        supabase.removeChannel(channel);
      };
    }
  },[loadCloudData]);

  // Filter students based on top institution switcher
  const filteredStudents = useMemo(()=>{
    if(selectedInst === "All") return students;
    return students.filter(s=>s.institution === selectedInst);
  },[students, selectedInst]);

  const openModal = (type,arg)=> setModal({type,arg});
  const closeModal = ()=> setModal(null);

  const handleAddAssessment = (ass)=> setAssessments(prev=>[ass, ...prev]);
  const handleAddBatch = (newBatch)=> setStudents(prev=>[...newBatch, ...prev]);
  const handleAddDrive = (drive)=> setDrives(prev=>[drive, ...prev]);
  const handleAddInstitution = (inst)=> setInstitutions(prev=>[inst, ...prev]);
  const handleAddNotification = (notif)=> setNotifications(prev=>[notif, ...prev]);

  const unreadNotifs = notifications.filter(n=>!n.read).length;

  return (
    <div className="shell">
      <div className="watermark-bg" style={{backgroundImage: `url(/logo.png), url(${PLACED_LOGO_SRC})`}} aria-hidden="true"></div>
      <Sidebar 
        view={view} 
        setView={setView} 
        open={sidebarOpen} 
        setOpen={setSidebarOpen} 
        unreadNotifs={unreadNotifs}
        isSupabaseConnected={isSupabaseConnected}
        openConnectModal={()=>openModal("connect_supabase")}
        onLogoutClick={()=>openModal("confirm_logout")}
      />
      <div className="main">
        <Header 
          setOpen={setSidebarOpen} 
          setView={setView} 
          openModal={openModal}
          selectedInst={selectedInst}
          setSelectedInst={setSelectedInst}
          institutions={institutions}
          notifications={notifications}
          onOpenSearch={()=>setIsSearchOpen(true)}
          onLogoutClick={()=>openModal("confirm_logout")}
        />
        <div className="content">
          {view==="dashboard" && (
            <DashboardView 
              openModal={openModal} 
              setView={setView} 
              setStudentFilterRisk={setFilterRisk}
              onSelectStudent={setSelectedStudent}
              students={filteredStudents}
              drives={drives}
              assessments={assessments}
              institutions={institutions}
            />
          )}
          {view==="students" && (
            <StudentsView 
              students={filteredStudents} 
              institutions={institutions} 
              filterRisk={filterRisk}
              setFilterRisk={setFilterRisk}
              onSelectStudent={setSelectedStudent}
            />
          )}
          {view==="institutions" && (
            <InstitutionsView 
              institutions={institutions} 
              students={students}
              onSelectInstitution={(inst)=>{ setSelectedInst(inst); setView("dashboard"); }}
              openModal={openModal}
            />
          )}
          {view==="departments" && <DepartmentsView students={filteredStudents}/>}
          {view==="assessments" && <AssessmentsView assessments={assessments} openModal={openModal} studyModules={studyModules} setStudyModules={setStudyModules}/>}
          {view==="drives" && <PlacementDrivesView drives={drives} openModal={openModal}/>}
          {view==="analytics" && <AnalyticsView students={filteredStudents} institutions={institutions}/>}
          {view==="reports" && <ReportsView openModal={openModal}/>}
          {view==="notifications" && <NotificationsView notifications={notifications} setNotifications={setNotifications}/>}
          {view==="settings" && (
            <SettingsView 
              isSupabaseConnected={isSupabaseConnected} 
              openConnectModal={()=>openModal("connect_supabase")}
              onLogoutClick={()=>openModal("confirm_logout")}
            />
          )}
        </div>
      </div>

      {modal && modal.type==="assessment" && (
        <CreateAssessmentModal onClose={closeModal} onAdd={handleAddAssessment} institutions={institutions}/>
      )}
      {modal && modal.type==="upload" && (
        <UploadBatchModal onClose={closeModal} onAddBatch={handleAddBatch} institutions={institutions}/>
      )}
      {modal && modal.type==="drive" && (
        <AssignDriveModal onClose={closeModal} onAddDrive={handleAddDrive} institutions={institutions} departments={departments}/>
      )}
      {modal && modal.type==="report" && (
        <GenerateReportModal onClose={closeModal} reportName={modal.arg} students={students} institutions={institutions}/>
      )}
      {modal && modal.type==="add_institution" && (
        <InviteInstitutionModal onClose={closeModal} onAdd={handleAddInstitution}/>
      )}
      {modal && modal.type==="connect_supabase" && (
        <SupabaseSetupModal onClose={closeModal} onConnected={()=>{ setIsSupabaseConnected(true); loadCloudData(); }}/>
      )}
      {modal && modal.type==="confirm_logout" && (
        <LogoutModal onClose={closeModal} onConfirm={async ()=>{ 
          closeModal(); 
          try {
            if(supabase && supabase.auth){
              await supabase.auth.signOut();
            }
          } catch(e){
            console.error("SignOut error:", e);
          }
          localStorage.removeItem("placed_admin_logged_out");
          sessionStorage.removeItem("placed_admin_logged_out");
          sessionStorage.removeItem("placed_admin_auth");
          localStorage.removeItem("placed_admin_auth");
          Object.keys(localStorage).forEach(k => {
            if(k.startsWith("sb-") && k.endsWith("-auth-token")) {
              localStorage.removeItem(k);
            }
          });
          toast("You have been logged out of the administrative session."); 
        }}/>
      )}

      {selectedStudent && (
        <StudentDetailModal student={selectedStudent} onClose={()=>setSelectedStudent(null)} onAddNotification={handleAddNotification}/>
      )}

      <SearchPalette 
        isOpen={isSearchOpen} 
        onClose={()=>setIsSearchOpen(false)}
        students={students}
        drives={drives}
        assessments={assessments}
        onNavigate={setView}
        onSelectStudent={setSelectedStudent}
      />
    </div>
  );
}

function Root(){
  return <ToastProvider><App/></ToastProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
