<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLACED — Placement &amp; Assessment Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<!-- Supabase JS Client & PapaParse for CSV processing -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#F8FAFC;
    --surface:#FFFFFF;
    --surface-alt:#F1F5F9;
    --ink:#111827;
    --ink-soft:#6B7280;
    --ink-faint:#9CA3AF;
    --border:#E5E7EB;
    --border-soft:#F3F4F6;
    --brand:#2563EB;
    --brand-2:#3B82F6;
    --brand-soft:#EFF6FF;
    --good:#22C55E;
    --good-soft:#F0FDF4;
    --warn:#F59E0B;
    --warn-soft:#FFF7ED;
    --bad:#EF4444;
    --bad-soft:#FEF2F2;
    --r-lg:20px;
    --r-md:16px;
    --r-sm:10px;
    --sh-sm:0 1px 2px rgba(15,23,42,.05);
    --sh-md:0 6px 20px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.04);
    --sh-lg:0 20px 48px rgba(15,23,42,.14), 0 4px 10px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-feature-settings:"tnum";}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#94A3B8;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;}
  /* ---------- dark navy sidebar to match placed-student-dashboard ---------- */
  .sidebar{
    width:248px;flex-shrink:0;
    background:#0F172A;
    border-right:1px solid #1E293B;
    display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;z-index:40;
    transition:transform .25s ease;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:20px 18px 16px 18px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 50%,#7C3AED 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(37,99,235,.4);
    flex-shrink:0;
  }
  .brand-name{font-weight:800;font-size:16.5px;letter-spacing:-.02em;line-height:1;color:#FFFFFF;}
  .brand-sub{font-size:10.5px;color:#94A3B8;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;font-weight:600;}
  
  .conn-badge{
    margin:12px 14px 8px 14px;padding:7px 10px;border-radius:8px;
    font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer;
    transition:all .15s;
  }
  .conn-badge.live{background:rgba(34,197,94,0.15);color:#4ADE80;border:1px solid rgba(34,197,94,0.25);}
  .conn-badge.offline{background:rgba(245,158,11,0.15);color:#FBBF24;border:1px solid rgba(245,158,11,0.25);}
  .conn-badge:hover{opacity:.9;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulseDot 2s infinite;}
  @keyframes pulseDot{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}

  .nav{flex:1;overflow-y:auto;padding:6px 10px;}
  .nav::-webkit-scrollbar{width:4px;}
  .nav::-webkit-scrollbar-thumb{background:#1E293B;border-radius:4px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:9px 12px;border-radius:8px;margin-bottom:3px;
    color:#94A3B8;font-weight:500;font-size:13.5px;
    border:none;background:transparent;width:100%;text-align:left;
    transition:all .15s;
    position:relative;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#F1F5F9;}
  .nav-item.active{
    background:linear-gradient(135deg,rgba(37,99,235,0.25) 0%,rgba(124,58,237,0.15) 100%);
    color:#60A5FA;
    font-weight:600;
    border:1px solid rgba(37,99,235,0.3);
  }
  .nav-item.active:before{
    content:"";
    background:linear-gradient(#2563EB,#7C3AED);
    border-radius:0 3px 3px 0;
    width:3px;height:60%;
    position:absolute;top:50%;left:0;
    transform:translateY(-50%);
  }
  .nav-item.active svg{stroke:#60A5FA;}
  .nav-item svg{stroke:#64748B;flex-shrink:0;transition:stroke .15s;}
  .nav-item:hover svg{stroke:#94A3B8;}
  .nav-item.active .nav-badge{background:#2563EB;color:#fff;}
  .nav-badge{
    margin-left:auto;background:#EF4444;color:#fff;font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:20px;
  }
  .nav-section-label{
    font-size:10px;font-weight:700;letter-spacing:.08em;color:#64748B;
    text-transform:uppercase;padding:16px 12px 6px 12px;
  }
  .sidebar-foot{
    padding:14px 16px;border-top:1px solid #1E293B;
    background:#0B1120;
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,rgba(37,99,235,0.3),rgba(124,58,237,0.2));
    border:1.5px solid rgba(37,99,235,0.6);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
    color:#93C5FD;flex-shrink:0;
  }
  .sidebar-foot div:nth-child(2) div:first-child{color:#F1F5F9;font-weight:600;font-size:13px;}
  .main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-width:0;position:relative;}
  .header{
    height:64px;background:rgba(248,250,252,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;
    padding:0 24px;position:sticky;top:0;z-index:90;
  }
  .hamburger{display:none;background:none;border:none;padding:6px;border-radius:8px;}
  .hamburger:hover{background:var(--surface-alt);}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px;
    width:320px;max-width:40vw;cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box:hover{border-color:#CBD5E1;box-shadow:var(--sh-sm);}
  .search-box input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink);cursor:pointer;}
  .search-box input::placeholder{color:var(--ink-faint);}
  .kbd{font-size:10.5px;color:var(--ink-faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-family:'IBM Plex Mono',monospace;}
  .switcher{
    display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:7px 12px;
    font-size:13px;font-weight:600;color:var(--ink);
  }
  .switcher:hover{border-color:#CBD5E1;}
  .header-spacer{flex:1;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface-alt);}
  .dot-flag{
    position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;
    background:var(--bad);border:1.5px solid var(--surface);
  }
  .content{padding:24px 28px 60px 28px;max-width:1500px;width:100%;margin:0 auto;position:relative;z-index:1;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:22px;font-weight:800;letter-spacing:-.02em;}
  .page-desc{color:var(--ink-soft);font-size:13.5px;margin-top:3px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border-radius:10px;
    padding:9px 15px;font-weight:600;font-size:13px;border:1px solid transparent;
    transition:transform .08s, box-shadow .12s, background .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{box-shadow:var(--sh-md);background:#1E293B;}
  .btn-brand{background:var(--brand);color:#fff;}
  .btn-brand:hover{box-shadow:0 8px 20px rgba(37,99,235,.28);background:#1D4ED8;}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-alt);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
  .btn-danger{background:var(--bad);color:#fff;}
  .btn-danger:hover{background:#DC2626;box-shadow:0 8px 20px rgba(239,68,68,.25);}

  /* ---------- watermark background ---------- */
  .watermark-bg{
    position:fixed;
    top:50%;
    left:calc(50% + 124px);
    transform:translate(-50%,-50%);
    width:560px;
    max-width:75vw;
    height:560px;
    max-height:75vh;
    background-image:url('/logo.png');
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.038;
    pointer-events:none;
    z-index:0;
    user-select:none;
    mix-blend-mode:multiply;
    transition:opacity .3s ease;
  }

  /* ---------- profile dropdown & session ---------- */
  .profile-wrap{position:relative;z-index:100;}
  .profile-dropdown{
    position:absolute;top:calc(100% + 10px);right:0;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 20px 48px rgba(15,23,42,.18), 0 4px 12px rgba(15,23,42,.08);
    width:275px;padding:8px;z-index:1000;
    animation:pop .16s cubic-bezier(.2,.9,.3,1.2);
  }
  .profile-head{
    display:flex;align-items:center;gap:11px;padding:10px 10px 12px 10px;
    border-bottom:1px solid var(--border-soft);margin-bottom:6px;
  }
  .profile-menu-item{
    display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
    border-radius:8px;border:none;background:transparent;color:var(--ink);
    font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;text-align:left;
  }
  .profile-menu-item:hover{background:var(--surface-alt);}
  .profile-menu-item.logout{
    color:var(--bad);margin-top:4px;border-top:1px solid var(--border-soft);
    padding-top:10px;font-weight:600;
  }
  .profile-menu-item.logout:hover{background:var(--bad-soft);color:#DC2626;}
  .sidebar-logout-btn{
    background:transparent;border:none;color:#64748B;padding:6px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:all .15s;margin-left:auto;
  }
  .sidebar-logout-btn:hover{background:rgba(239,68,68,0.18);color:#F87171;}

  /* ---------- lock screen / signed out overlay ---------- */
  .lock-screen-overlay{
    min-height:100vh;background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    position:relative;overflow:hidden;
  }
  .lock-card{
    background:var(--surface);border-radius:24px;box-shadow:0 25px 60px rgba(0,0,0,0.35);
    width:100%;max-width:440px;padding:36px 32px;text-align:center;position:relative;z-index:2;
    animation:pop .25s cubic-bezier(.2,.9,.3,1.2);
  }

  /* ---------- cards / grid ---------- */
  .grid{display:grid;gap:16px;}
  .grid-kpi{grid-template-columns:repeat(5,1fr);}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  .grid-4chart{grid-template-columns:1.5fr 1fr;}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:var(--sh-sm);
    padding:18px 18px;
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .card-title{font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .card-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

  .kpi-card{position:relative;overflow:hidden;padding:16px 16px 14px 16px;}
  .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;}
  .kpi-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .kpi-value{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:26px;margin-top:8px;letter-spacing:-.01em;}
  .kpi-icon-wrap{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);font-weight:700;padding:0 12px 10px 12px;border-bottom:1px solid var(--border);
    user-select:none;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-alt);}
  .cell-strong{font-weight:600;}
  .cell-mono{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .table-wrap{overflow-x:auto;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .pill-good{background:var(--good-soft);color:var(--good);}
  .pill-warn{background:var(--warn-soft);color:var(--warn);}
  .pill-bad{background:var(--bad-soft);color:var(--bad);}
  .pill-neutral{background:var(--surface-alt);color:var(--ink-soft);}
  .pill-brand{background:var(--brand-soft);color:var(--brand);}
  .pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .avatar-sm{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;
    color:#fff;
  }
  .row-user{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .row-user-name{font-weight:600;font-size:13px;}
  .row-user-sub{font-size:11.5px;color:var(--ink-faint);}

  .quick-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .qa-btn{
    background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:var(--r-md);
    padding:14px 10px;text-align:left;display:flex;flex-direction:column;gap:9px;
    transition:transform .1s, border-color .1s, background .1s;
  }
  .qa-btn:hover{background:var(--surface);border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh-sm);}
  .qa-icon{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;}
  .qa-icon svg{stroke:var(--brand);}
  .qa-label{font-size:12px;font-weight:700;line-height:1.25;}

  .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .select-field{
    border:1px solid var(--border);background:var(--surface);border-radius:9px;
    padding:8px 10px;font-size:12.5px;color:var(--ink-soft);font-weight:500;min-width:130px;
    outline:none;
  }
  .select-field:focus{border-color:var(--brand);}
  .search-inline{
    display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);
    border-radius:9px;padding:8px 11px;flex:1;min-width:180px;max-width:280px;
  }
  .search-inline input{border:none;outline:none;background:transparent;font-size:12.5px;width:100%;}

  .gauge-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
  .gauge-label{position:absolute;font-family:'IBM Plex Mono',monospace;font-weight:700;text-align:center;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,17,25,.45);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    animation:pop .18s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px 14px 22px;border-bottom:1px solid var(--border-soft);}
  .modal-title{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .modal-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
  .modal-foot{padding:16px 22px 20px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border-soft);}
  .field-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .field-input{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font-size:13px;outline:none;background:var(--surface);color:var(--ink);
  }
  .field-input:focus{border-color:var(--brand);}
  .chip-group{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);
    background:var(--surface-alt);color:var(--ink-soft);cursor:pointer;transition:all .1s;
  }
  .chip.selected{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);}
  .dropzone{
    border:1.5px dashed var(--border);border-radius:var(--r-md);padding:26px 16px;
    text-align:center;color:var(--ink-soft);font-size:12.5px;background:var(--surface-alt);
    transition:border-color .15s, background .15s;
  }
  .dropzone:hover{border-color:var(--brand);background:var(--brand-soft);}
  .close-x{background:none;border:none;padding:6px;border-radius:8px;flex-shrink:0;}
  .close-x:hover{background:var(--surface-alt);}
  .step-track{display:flex;gap:6px;margin-bottom:4px;}
  .step-dot{flex:1;height:4px;border-radius:4px;background:var(--border);transition:background .2s;}
  .step-dot.done{background:var(--brand);}

  /* toasts */
  .toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .toast{
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--sh-lg);
    display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;max-width:340px;
    animation:toastIn .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
  .toast-icon{width:22px;height:22px;border-radius:7px;background:var(--good);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .progress-track{height:6px;border-radius:6px;background:var(--surface-alt);overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;transition:width .4s ease;}

  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state svg{stroke:var(--ink-faint);margin-bottom:10px;}
  .empty-title{font-weight:700;color:var(--ink-soft);font-size:14px;margin-bottom:4px;}

  .notif-row{display:flex;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border-soft);align-items:flex-start;}
  .notif-row:last-child{border-bottom:none;}
  .notif-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .notif-time{font-size:11px;color:var(--ink-faint);margin-top:2px;}

  .tabs{display:flex;gap:4px;background:var(--surface-alt);padding:4px;border-radius:11px;width:fit-content;margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:7px 14px;border:none;background:transparent;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm);}

  .mobile-scrim{display:none;position:fixed;inset:0;background:rgba(15,17,25,.4);z-index:39;}

  /* Quick search modal */
  .search-palette{
    background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
    width:100%;max-width:580px;overflow:hidden;
    animation:pop .18s cubic-bezier(.2,.9,.3,1.2);
  }
  .palette-input-wrap{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
  .palette-input{border:none;outline:none;background:transparent;font-size:15px;width:100%;color:var(--ink);font-weight:500;}
  .palette-results{max-height:360px;overflow-y:auto;padding:8px 10px;}
  .palette-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    cursor:pointer;border:none;background:transparent;width:100%;text-align:left;
  }
  .palette-item:hover{background:var(--surface-alt);}
  .palette-item-icon{width:28px;height:28px;border-radius:8px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;}
  .palette-item-title{font-weight:600;font-size:13.5px;color:var(--ink);}
  .palette-item-sub{font-size:11.5px;color:var(--ink-faint);}

  @media (max-width:1100px){
    .grid-kpi{grid-template-columns:repeat(3,1fr);}
    .grid-2, .grid-4chart{grid-template-columns:1fr;}
    .quick-actions{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:760px){
    .watermark-bg{left:50%;width:300px;height:300px;opacity:0.032;}
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .hamburger{display:flex;align-items:center;justify-content:center;}
    .search-box{display:none;}
    .grid-kpi{grid-template-columns:repeat(2,1fr);}
    .quick-actions{grid-template-columns:repeat(2,1fr);}
    .content{padding:18px 14px 50px 14px;}
    .mobile-scrim.show{display:block;}
    .switcher span.sw-full{display:none;}
  }
</style>
</head>

/* ============================== READINESS & RISK CALCULATION ============================== */
function computeReadiness(a,c,comm,resume,interviewDone){
  const base = (Number(a)||0)*0.25 + (Number(c)||0)*0.35 + (Number(comm)||0)*0.2 + (Number(resume)||0)*0.15;
  return Math.min(100, Math.round(base + (interviewDone?5:0)));
}
function riskOf(score){ if(score>=75) return "Low"; if(score>=55) return "Medium"; return "High"; }

const instColor = (short)=>({CIE:"#2563EB",VRTU:"#22C55E",AGCE:"#F59E0B",BIS:"#EF4444",KPC:"#06B6D4",SMCT:"#7C3AED"}[short] || "#2563EB");

/* ============================== CSV DOWNLOAD HELPER ============================== */
function exportCSV(filename, headers, rows){
  const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

/* ============================== TOAST CONTEXT ============================== */
const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts] = useState([]);
  const push = (msg)=>{
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3400);
  };
  return <ToastCtx.Provider value={push}>
    {children}
    <div className="toast-stack">
      {toasts.map(t=>(
        <div className="toast" key={t.id}>
          <div className="toast-icon"><Icon name="check" size={13} color="#fff" strokeWidth={2.4}/></div>
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  </ToastCtx.Provider>;
}
function useToast(){ return useContext(ToastCtx); }

/* ============================== GAUGE ============================== */
function bandColor(score){ if(score>=75) return "var(--good)"; if(score>=55) return "var(--warn)"; return "var(--bad)"; }
function Gauge({score, size=64, stroke=7, showLabel=true}){
  const numScore = typeof score === "number" ? score : 0;
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const pct = Math.max(0,Math.min(100,numScore))/100;
  const color = bandColor(numScore);
  return (
    <div className="gauge-wrap" style={{width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)", transformOrigin:"center"}}>
        <circle cx={size/2} cy={size/2} r={r} stroke="var(--border-soft)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={c-c*pct} strokeLinecap="round"
          style={{transition:"stroke-dashoffset .6s ease"}}/>
      </svg>

function TrendChart({data = []}){
  if(!data || data.length === 0){
    return (
      <div className="empty-state" style={{padding:"48px 10px",minHeight:220,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <Icon name="activity" size={28}/>
        <div className="empty-title">No trend data available yet</div>
        <div style={{fontSize:12}}>Readiness progression will appear as cohorts complete assessments.</div>
      </div>
    );
  }

  const w=560,h=220,padL=32,padR=14,padT=16,padB=26;
  const min=40,max=90;
  const xStep = (w-padL-padR)/(data.length-1 || 1);
  const yFor = v => padT + (max-v)/(max-min)*(h-padT-padB);
  const xFor = i => padL + i*xStep;
  const [hover,setHover] = useState(null);
  const pathD = data.map((d,i)=> (i===0?"M":"L")+xFor(i).toFixed(1)+","+yFor(d.v).toFixed(1)).join(" ");
  const areaD = pathD + ` L${xFor(data.length-1).toFixed(1)},${(h-padB).toFixed(1)} L${xFor(0).toFixed(1)},${(h-padB).toFixed(1)} Z`;
  const yTicks = [40,50,60,70,80,90];
  return (
    <div style={{height:220,position:"relative"}}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="100%" preserveAspectRatio="none">
        <defs>
          <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#2563EB" stopOpacity="0.28"/>
            <stop offset="100%" stopColor="#2563EB" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {yTicks.map(t=>(
          <g key={t}>
            <line x1={padL} x2={w-padR} y1={yFor(t)} y2={yFor(t)} stroke="#F1F5F9" strokeWidth="1"/>
            <text x={padL-8} y={yFor(t)+3} textAnchor="end" fontSize="9.5" fontFamily="IBM Plex Mono" fill="#9CA3AF">{t}</text>
          </g>
        ))}
        <path d={areaD} fill="url(#trendFill)" stroke="none"/>
        <path d={pathD} fill="none" stroke="#2563EB" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {data.map((d,i)=>(
          <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{cursor:"pointer"}}>
            <circle cx={xFor(i)} cy={yFor(d.v)} r={hover===i?7:9} fill="transparent"/>
            <circle cx={xFor(i)} cy={yFor(d.v)} r={hover===i?5:3.5} fill="#2563EB" stroke="#fff" strokeWidth="1.5"/>
            <text x={xFor(i)} y={h-8} textAnchor="middle" fontSize="9.5" fontFamily="IBM Plex Mono" fill="#9CA3AF">{d.w}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

function DeptChart({students = [], departments = []}){
  const activeDepts = departments.length ? departments : Array.from(new Set(students.map(s=>s.department).filter(Boolean)));
  
  if(!students.length || !activeDepts.length){
    return (
      <div className="empty-state" style={{padding:"50px 10px",minHeight:230,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>

        <div style={{fontSize:12}}>Department skill comparison will calculate automatically when students are registered.</div>
      </div>

    const rows = students.filter(s=>s.department===d);
    const avg = (k)=> Math.round(rows.reduce((a,r)=>a+(Number(r[k])||0),0)/(rows.length||1));
    return {d, label:d.substring(0,6), coding: avg("coding"), aptitude: avg("aptitude")};

  const w=560,h=230,padL=30,padR=10,padT=10,padB=34;

            <text x={padL-8} y={yFor(t)+3} textAnchor="end" fontSize="9.5" fontFamily="IBM Plex Mono" fill="#9CA3AF">{t}</text>
          </g>

          const cx = padL + i*groupW + groupW/2;

            <g key={x.d} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{cursor:"pointer"}}>
              <rect x={cx-barW-2} y={yFor(x.coding)} width={barW} height={(h-padB)-yFor(x.coding)} rx="4" fill="#2563EB" opacity={hover===null||hover===i?1:0.35}/>

function CompletionDonut({students = []}){
  const done = students.filter(s=>s.interview==="Completed").length;
  const sched = students.filter(s=>s.interview==="Scheduled").length;
  const pend = students.filter(s=>s.interview==="Pending" || !s.interview).length;
  const total = done+sched+pend;

  if(total === 0){
    return (
      <div className="empty-state" style={{padding:"40px 10px",minHeight:210,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <Icon name="check-sq" size={28}/>
        <div className="empty-title">No assessment completion data</div>
        <div style={{fontSize:12}}>Mock interview and test completion status will appear here.</div>
      </div>
    );
  }

  const segs = [
    {label:"Completed",v:done,color:"#22C55E"},
    {label:"Scheduled",v:sched,color:"#F59E0B"},
    {label:"Pending",v:pend,color:"#E5E7EB"},
  ];
  const size=170,stroke=20,r=(size-stroke)/2,c=2*Math.PI*r;
  const [hover,setHover] = useState(null);

  let runningAcc = 0;
  const renderedSegs = segs.map((s,i)=>{
    const frac = total ? s.v/total : 0;
    const dash = frac*c;
    const offset = -runningAcc;
    runningAcc += dash;
    return { ...s, dash, offset };
  });

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
      <div style={{position:"relative",width:size,height:size}}>
        <svg width={size} height={size} style={{transform:"rotate(-90deg)", transformOrigin:"center"}}>
          <circle cx={size/2} cy={size/2} r={r} stroke="#F1F5F9" strokeWidth={stroke} fill="none"/>
          {renderedSegs.map((s,i)=>(
            <circle key={i} cx={size/2} cy={size/2} r={r} stroke={s.color} strokeWidth={hover===i?stroke+3:stroke} fill="none"
              strokeDasharray={`${s.dash} ${c-s.dash}`} strokeDashoffset={s.offset}
              onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}
              style={{transition:"stroke-width .12s",cursor:"pointer"}}/>
          ))}
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
          <div className="mono" style={{fontSize:22,fontWeight:700}}>{hover!==null?segs[hover].v:total}</div>
          <div style={{fontSize:10.5,color:"var(--ink-faint)",fontWeight:600}}>{hover!==null?segs[hover].label:"Total"}</div>
        </div>
      </div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",justifyContent:"center"}}>
        {segs.map((s,i)=>(
          <span key={s.label} style={{display:"flex",alignItems:"center",gap:6,fontSize:11.5,color:"var(--ink-soft)",cursor:"pointer"}}
            onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
            <span style={{width:9,height:9,borderRadius:"50%",background:s.color,display:"inline-block"}}></span>{s.label} ({s.v})
          </span>
        ))}
      </div>
    </div>
  );
}

function DistributionChart({students = []}){
  if(!students || students.length === 0){
    return (
      <div className="empty-state" style={{padding:"40px 10px",minHeight:210,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>

        <div className="empty-title">No readiness distribution data</div>
        <div style={{fontSize:12}}>Candidate readiness counts will populate across risk score bands.</div>
      </div>
    );
  }

  const buckets = [[0,40],[40,55],[55,75],[75,90],[90,101]];
  const labels = ["0–40","40–55","55–75","75–90","90–100"];
  const colors = ["#EF4444","#F97316","#F59E0B","#3B82F6","#22C55E"];
  const counts = buckets.map(([lo,hi])=> students.filter(s=> (s.readiness||0)>=lo && (s.readiness||0)<hi).length);
  const w=560,h=210,padL=28,padR=10,padT=14,padB=30;
  const max = Math.max(...counts,4);
  const barSlot = (w-padL-padR)/counts.length;
  const barW = barSlot*0.5;
  const yFor = v => padT + (max-v)/max*(h-padT-padB);
  const [hover,setHover] = useState(null);
  return (
    <div style={{height:210,position:"relative"}}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="100%" preserveAspectRatio="none">
        <line x1={padL} x2={w-padR} y1={h-padB} y2={h-padB} stroke="#F1F5F9" strokeWidth="1"/>
        {counts.map((v,i)=>{
          const cx = padL + i*barSlot + barSlot/2;
          return (
            <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{cursor:"pointer"}}>
              <rect x={cx-barW/2} y={yFor(v)} width={barW} height={(h-padB)-yFor(v)} rx="6" fill={colors[i]} opacity={hover===null||hover===i?1:0.4}/>
              <text x={cx} y={yFor(v)-8} textAnchor="middle" fontSize="11" fontFamily="IBM Plex Mono" fontWeight="700" fill="var(--ink)">{v}</text>
              <text x={cx} y={h-10} textAnchor="middle" fontSize="10" fontFamily="IBM Plex Mono" fill="#9CA3AF">{labels[i]}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function SupabaseSetupModal({onClose, onConnected}){
  const toast = useToast();
  const [url, setUrl] = useState(localStorage.getItem("placed_supabase_url") || "");
  const [key, setKey] = useState(localStorage.getItem("placed_supabase_key") || "");
  const [testing, setTesting] = useState(false);

  const handleTestAndSave = async ()=>{
    if(!url.trim() || !key.trim()){
      toast("Please enter both Supabase Project URL and Anon Public Key.");
      return;
    }
    setTesting(true);
    try {
      const client = window.supabase.createClient(url.trim(), key.trim());
      const { data, error } = await client.from("admin_institutions").select("id").limit(1);
      if(error && error.code !== "PGRST116"){
        throw error;
      }
      localStorage.setItem("placed_supabase_url", url.trim());
      localStorage.setItem("placed_supabase_key", key.trim());
      supabase = client;
      toast("Supabase Connected Successfully!");
      onConnected();
      onClose();
    } catch(err){
      console.error(err);
      toast("Connection Failed: " + (err.message || "Invalid credentials or table schema not created yet."));
    } finally {
      setTesting(false);
    }
  };

  return (
    <ModalShell title="Connect Supabase Cloud Backend" desc="Enter your Supabase Project API credentials for real-time cloud data storage." onClose={onClose}
      foot={<>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Close</button>
        <button className="btn btn-brand btn-sm" onClick={handleTestAndSave} disabled={testing}>
          <Icon name="database" size={14} color="#fff"/> {testing ? "Validating..." : "Connect & Sync"}
        </button>
      </>}>
      <div>
        <label className="field-label">Supabase Project URL</label>
        <input className="field-input" placeholder="https://your-project.supabase.co" value={url} onChange={e=>setUrl(e.target.value)}/>
      </div>
      <div>
        <label className="field-label">Supabase Anon Public API Key</label>
        <input className="field-input" type="password" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." value={key} onChange={e=>setKey(e.target.value)}/>

        <div style={{fontSize:12,color:"var(--ink-soft)",lineHeight:1.5}}>
          <strong>Tip:</strong> Ensure you ran <code>supabase_schema.sql</code> in your Supabase SQL editor to create the required tables.

  );
}

function UploadBatchModal({onClose, onAddBatch, institutions}){
  const toast = useToast();
  const fileInputRef = useRef(null);
  const [file,setFile] = useState(null);
  const [selectedInst,setSelectedInst] = useState(institutions[0]?.short || "CIE");
  const [parsing, setParsing] = useState(false);

  const handleFile = (e)=>{
    const f = e.target.files?.[0];
    if(f){
      setFile(f);
    }
  };

  const handleProcess = ()=>{
    if(!file){
      toast("Please select a CSV file to upload.");
      return;
    }
    setParsing(true);

    if(!window.Papa){
      toast("CSV Parser ready.");
      setParsing(false);
      onClose();
      return;
    }

    window.Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async (results)=>{
        const records = results.data.map((row, idx)=>{
          const apt = Number(row.aptitude || row.Aptitude) || 0;
          const cod = Number(row.coding || row.Coding) || 0;
          const comm = Number(row.communication || row.Communication) || 0;
          const resume = Number(row.resume || row.Resume) || 0;
          const interview = row.interview || row.Interview || "Pending";
          const readiness = Number(row.readiness || row.Readiness) || computeReadiness(apt, cod, comm, resume, interview==="Completed");
          const risk = row.risk || row.Risk || riskOf(readiness);

          return {
            id: row.id || ("S" + (Date.now().toString().slice(-4) + idx)),
            name: row.name || row.Name || ("Student " + (idx+1)),
            email: row.email || row.Email || `student.${idx+1}@${selectedInst.toLowerCase()}.edu`,
            institution: row.institution || row.Institution || selectedInst,
            department: row.department || row.Department || "Computer Science",
            year: row.year || row.Year || "Final Yr",
            aptitude: apt,
            coding: cod,
            communication: comm,
            resume: resume,
            interview,
            readiness,
            risk,
            last_active: "Just now"
          };
        });

        if(records.length === 0){
          toast("No valid candidate rows found in the CSV.");
          setParsing(false);
          return;
        }

        if(supabase){
          const { error } = await supabase.from("admin_students").insert(records);
          if(error){
            toast("DB Insert Error: " + error.message);
            setParsing(false);
            return;
          }
        }

        onAddBatch(records);
        toast(`Successfully ingested ${records.length} student records!`);
        setParsing(false);
        onClose();
      },
      error: (err)=>{
        toast("CSV Parsing error: " + err.message);
        setParsing(false);
      }
    });
  };

  return (
    <ModalShell title="Upload student batch" desc="Bulk-add students from a CSV spreadsheet directly into your cloud database." onClose={onClose}
      foot={<>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
        <button className="btn btn-brand btn-sm" onClick={handleProcess} disabled={parsing}>
          <Icon name="upload" size={14} color="#fff"/> {parsing ? "Ingesting..." : "Process batch"}
        </button>
      </>}>
      <input type="file" ref={fileInputRef} style={{display:"none"}} accept=".csv" onChange={handleFile}/>
      <div className="dropzone" style={{cursor:"pointer"}} onClick={()=>fileInputRef.current?.click()}>
        <Icon name="upload" size={26}/>
        <div style={{marginTop:8,fontWeight:700,color:"var(--ink)"}}>{file ? `${file.name}` : "Click to browse or drop CSV"}</div>
        <div style={{marginTop:4}}>Columns supported: name, email, department, year, aptitude, coding, communication, resume</div>
      </div>
      <div>
        <label className="field-label">Default Target institution</label>
        {institutions && institutions.length > 0 ? (
          <select className="field-input" value={selectedInst} onChange={e=>setSelectedInst(e.target.value)}>
            {institutions.map(i=> <option key={i.id} value={i.short}>{i.name} ({i.short})</option>)}
          </select>
        ) : (
          <input className="field-input" placeholder="e.g. CIE" value={selectedInst} onChange={e=>setSelectedInst(e.target.value)}/>
        )}
      </div>
    </ModalShell>
  );
}

function AssignDriveModal({onClose, onAddDrive, institutions, departments}){
  const toast = useToast();
  const [step,setStep] = useState(1);
  const [formData, setFormData] = useState({
    company: "",
    role: "",
    pkg: "",
    eligibleDepts: [],
    minScore: 60,
    selectedInsts: [],
    date: ""
  });

  const toggleDept = (dept)=>{
    setFormData(prev=>({
      ...prev,
      eligibleDepts: prev.eligibleDepts.includes(dept) ? prev.eligibleDepts.filter(d=>d!==dept) : [...prev.eligibleDepts, dept]
    }));
  };

  const toggleInst = (short)=>{
    setFormData(prev=>({
      ...prev,
      selectedInsts: prev.selectedInsts.includes(short) ? prev.selectedInsts.filter(i=>i!==short) : [...prev.selectedInsts, short]
    }));
  };

  const handleSubmit = async ()=>{
    if(!formData.company.trim()){
      toast("Please enter a company name.");
      setStep(1);
      return;
    }
    const newDrive = {
      id: "d_" + Math.random().toString(36).substr(2, 8),
      company: formData.company.trim(),
      role: formData.role.trim() || "Graduate Engineer Trainee",
      pkg: formData.pkg.trim() || "—",
      applied: 0,
      appeared: 0,
      selected: 0,
      status: "Upcoming",
      date: formData.date ? new Date(formData.date).toLocaleDateString("en-GB", {day:"2-digit",month:"short",year:"numeric"}) : "Scheduled",
      institutions: formData.selectedInsts,
      departments: formData.eligibleDepts
    };

    if(supabase){
      const { error } = await supabase.from("admin_placement_drives").insert([newDrive]);
      if(error){
        toast("DB Error: " + error.message);
        return;
      }
    }
    onAddDrive(newDrive);
    toast(`Placement drive for ${formData.company} assigned successfully.`);
    onClose();
  };

  return (
    <ModalShell title="Assign placement drive" desc={`Step ${step} of 3`} onClose={onClose}
      foot={<>
        {step>1 && <button className="btn btn-ghost btn-sm" onClick={()=>setStep(step-1)}>Back</button>}
        <div style={{flex:1}}></div>
        {step<3 && <button className="btn btn-brand btn-sm" onClick={()=>setStep(step+1)}>Continue <Icon name="chevron-right" size={14} color="#fff"/></button>}
        {step===3 && <button className="btn btn-brand btn-sm" onClick={handleSubmit}><Icon name="check" size={14} color="#fff"/> Confirm & assign</button>}
      </>}>
      <div className="step-track">
        <div className={"step-dot "+(step>=1?"done":"")}></div>
        <div className={"step-dot "+(step>=2?"done":"")}></div>
        <div className={"step-dot "+(step>=3?"done":"")}></div>
      </div>
      {step===1 && <>
        <div>
          <label className="field-label">Company name</label>
          <input className="field-input" placeholder="e.g. Zynetra Systems" value={formData.company} onChange={e=>setFormData({...formData, company:e.target.value})}/>
        </div>
        <div>
          <label className="field-label">Job role</label>
          <input className="field-input" placeholder="e.g. SDE-1 / Data Analyst" value={formData.role} onChange={e=>setFormData({...formData, role:e.target.value})}/>
        </div>
        <div>
          <label className="field-label">Package (CTC)</label>
          <input className="field-input" placeholder="e.g. ₹8.5 LPA" value={formData.pkg} onChange={e=>setFormData({...formData, pkg:e.target.value})}/>
        </div>
      </>}
      {step===2 && <>
        <div>
          <label className="field-label">Eligible departments</label>
          {departments && departments.length > 0 ? (
            <div className="chip-group">
              {departments.map(d=> (
                <button key={d} type="button" className={"chip " + (formData.eligibleDepts.includes(d) ? "selected" : "")} onClick={()=>toggleDept(d)}>
                  {d}
                </button>
              ))}
            </div>
          ) : (
            <div className="chip-group">
              {["Computer Science","Electronics & Comm.","Information Technology","Mechanical","Electrical Engg."].map(d=> (
                <button key={d} type="button" className={"chip " + (formData.eligibleDepts.includes(d) ? "selected" : "")} onClick={()=>toggleDept(d)}>
                  {d}
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <label className="field-label">Minimum readiness score</label>
          <input className="field-input" type="number" placeholder="60" value={formData.minScore} onChange={e=>setFormData({...formData, minScore:e.target.value})}/>
        </div>
      </>}
      {step===3 && <>
        <div>
          <label className="field-label">Participating institutions</label>
          {institutions && institutions.length > 0 ? (
            <div className="chip-group">
              {institutions.map(i=> (
                <button key={i.id} type="button" className={"chip " + (formData.selectedInsts.includes(i.short) ? "selected" : "")} onClick={()=>toggleInst(i.short)}>
                  {i.name}
                </button>
              ))}
            </div>
          ) : (
            <div style={{fontSize:12,color:"var(--ink-faint)"}}>No institutions registered yet.</div>

        </div>
        <div>
          <label className="field-label">Drive date</label>
          <input className="field-input" type="date" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})}/>
        </div>
      </>}
    </ModalShell>
  );
}

function GenerateReportModal({onClose, reportName, students = [], institutions = []}){
  const toast = useToast();
  const [scope, setScope] = useState("All");

  const handleExportCSV = ()=>{
    const filtered = scope==="All" ? students : students.filter(s=>s.institution===scope);
    if(filtered.length === 0){
      toast("No student records available to export for selected scope.");
      return;
    }
    const headers = ["ID","Name","Institution","Department","Year","Aptitude","Coding","Communication","Resume","Readiness","Risk","Interview"];
    const rows = filtered.map(s => [s.id, `"${s.name}"`, s.institution, `"${s.department}"`, s.year, s.aptitude, s.coding, s.communication, s.resume, s.readiness, s.risk, s.interview]);
    exportCSV(`${(reportName||"report").toLowerCase().replace(/\s+/g,"_")}.csv`, headers, rows);
    toast("Report exported as CSV.");
    onClose();
  };

  const handleExportPDF = ()=>{
    if(students.length === 0){
      toast("No student records available to generate PDF.");
      return;
    }
    window.print();
    onClose();
  };

  return (
    <ModalShell title={reportName || "Generate report"} desc="Configure and export this report." onClose={onClose}
      foot={<>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
        <button className="btn btn-ghost btn-sm" onClick={handleExportCSV}><Icon name="download" size={14}/> Export CSV</button>
        <button className="btn btn-brand btn-sm" onClick={handleExportPDF}><Icon name="download" size={14} color="#fff"/> Print / Save PDF</button>
      </>}>
      <div style={{display:"flex",gap:12}}>
        <div style={{flex:1}}><label className="field-label">From</label><input className="field-input" type="date"/></div>
        <div style={{flex:1}}><label className="field-label">To</label><input className="field-input" type="date"/></div>
      </div>
      <div>
        <label className="field-label">Institution scope</label>
        <select className="field-input" value={scope} onChange={e=>setScope(e.target.value)}>
          <option value="All">All institutions</option>
          {institutions.map(i=> <option key={i.id} value={i.short}>{i.name}</option>)}
        </select>
      </div>
      <div className="card" style={{background:"var(--surface-alt)",border:"1px solid var(--border-soft)",padding:14}}>
        <div style={{fontSize:12,color:"var(--ink-soft)",lineHeight:1.6}}>Report compiles live readiness benchmarks, department averages, and candidate score records from your cloud database.</div>
      </div>
    </ModalShell>
  );
}

function SearchPalette({isOpen, onClose, students = [], drives = [], assessments = [], onNavigate, onSelectStudent}){
  const [q,setQ] = useState("");
  const inputRef = useRef(null);

  useEffect(()=>{
    if(isOpen){
      setTimeout(()=> inputRef.current?.focus(), 50);
    }
  },[isOpen]);

  if(!isOpen) return null;

  const filteredStudents = q ? students.filter(s=> s.name?.toLowerCase().includes(q.toLowerCase()) || s.department?.toLowerCase().includes(q.toLowerCase())).slice(0,4) : [];
  const filteredDrives = q ? drives.filter(d=> d.company?.toLowerCase().includes(q.toLowerCase()) || d.role?.toLowerCase().includes(q.toLowerCase())).slice(0,3) : [];
  const filteredAssessments = q ? assessments.filter(a=> a.name?.toLowerCase().includes(q.toLowerCase())).slice(0,3) : [];

  return (
    <div className="overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="search-palette">
        <div className="palette-input-wrap">
          <Icon name="search" size={18} color="var(--ink-faint)"/>
          <input ref={inputRef} className="palette-input" placeholder="Search students, drives, assessments, or navigation..." value={q} onChange={e=>setQ(e.target.value)}/>
          <button className="close-x" onClick={onClose}><Icon name="x" size={16}/></button>
        </div>
        <div className="palette-results">
          {q==="" && (
            <div style={{padding:"12px 14px",fontSize:12,color:"var(--ink-faint)"}}>
              Type to search students, recruiters, drives, or jump to views...
            </div>
          )}
          {filteredStudents.length>0 && (
            <div>
              <div className="nav-section-label" style={{padding:"6px 12px"}}>Students</div>
              {filteredStudents.map(s=>(
                <button key={s.id} className="palette-item" onClick={()=>{ onSelectStudent(s); onClose(); }}>
                  <div className="avatar-sm" style={{background:instColor(s.institution)}}>{initials(s.name)}</div>
                  <div>
                    <div className="palette-item-title">{s.name} ({s.readiness || 0} pts)</div>
                    <div className="palette-item-sub">{s.institution} · {s.department}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
          {filteredDrives.length>0 && (
            <div>
              <div className="nav-section-label" style={{padding:"6px 12px"}}>Placement Drives</div>
              {filteredDrives.map(d=>(
                <button key={d.id} className="palette-item" onClick={()=>{ onNavigate("drives"); onClose(); }}>
                  <div className="palette-item-icon"><Icon name="briefcase" size={14}/></div>
                  <div>
                    <div className="palette-item-title">{d.company} — {d.role}</div>
                    <div className="palette-item-sub">{d.pkg} · {d.status}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
          {filteredAssessments.length>0 && (
            <div>
              <div className="nav-section-label" style={{padding:"6px 12px"}}>Assessments</div>
              {filteredAssessments.map(a=>(
                <button key={a.id} className="palette-item" onClick={()=>{ onNavigate("assessments"); onClose(); }}>
                  <div className="palette-item-icon"><Icon name="check-sq" size={14}/></div>
                  <div>
                    <div className="palette-item-title">{a.name}</div>
                    <div className="palette-item-sub">{a.type} · {a.completion}% done</div>
                  </div>
                </button>
              ))}
            </div>
          )}
          {q!=="" && filteredStudents.length===0 && filteredDrives.length===0 && filteredAssessments.length===0 && (
            <div className="empty-state" style={{padding:"24px 10px"}}>
              <div className="empty-title">No matching results found</div>
              <div style={{fontSize:12}}>Try searching with a different term.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function StudentsView({students = [], institutions = [], filterRisk, setFilterRisk, onSelectStudent, onDeleteStudent}){
  const toast = useToast();
  const [q,setQ] = useState("");
  const [inst,setInst] = useState("All");
  const [dept,setDept] = useState("All");
  const [risk,setRisk] = useState(filterRisk || "All");
  const [sortKey,setSortKey] = useState("readiness");
  const [sortDir,setSortDir] = useState("desc");

  useEffect(()=>{
    if(filterRisk) setRisk(filterRisk);
  },[filterRisk]);

  const uniqueDepartments = useMemo(()=> Array.from(new Set(students.map(s=>s.department).filter(Boolean))), [students]);

  let rows = students.filter(s=>
    (inst==="All"||s.institution===inst) &&
    (dept==="All"||s.department===dept) &&
    (risk==="All"||s.risk===risk) &&
    (q===""||s.name?.toLowerCase().includes(q.toLowerCase()) || s.email?.toLowerCase().includes(q.toLowerCase()))
  );

  rows = [...rows].sort((a,b)=>{
    const va = a[sortKey];
    const vb = b[sortKey];
    if(typeof va === "string"){
      return sortDir==="desc" ? String(vb||"").localeCompare(String(va||"")) : String(va||"").localeCompare(String(vb||""));
    }
    return sortDir==="desc" ? (Number(vb||0) - Number(va||0)) : (Number(va||0) - Number(vb||0));
  });

  const toggleSort = (k)=>{
    if(sortKey===k) setSortDir(d=>d==="desc"?"asc":"desc");
    else { setSortKey(k); setSortDir("desc"); }
  };
  const sortIcon = (k)=> sortKey===k ? (sortDir==="desc"?" ↓":" ↑") : "";

  const handleExportCSV = ()=>{
    if(rows.length === 0){
      toast("No student records to export.");
      return;
    }
    const headers = ["ID","Name","Institution","Department","Year","Aptitude","Coding","Communication","Resume","Readiness","Risk","Interview"];
    const exportRows = rows.map(s => [s.id, `"${s.name}"`, s.institution, `"${s.department}"`, s.year, s.aptitude, s.coding, s.communication, s.resume, s.readiness, s.risk, s.interview]);
    exportCSV("students_directory.csv", headers, exportRows);
    toast(`${rows.length} student records exported to CSV.`);
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">Students Directory</div>
          <div className="page-desc">{rows.length} of {students.length} students matching criteria</div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-ghost" onClick={handleExportCSV}><Icon name="download" size={15}/> Export CSV</button>
          <button className="btn btn-primary" onClick={()=>toast("TPO broadcast tool ready for integration.")}><Icon name="mail" size={15} color="#fff"/> Message TPOs</button>
        </div>
      </div>

      <div className="filters-bar">
        <div className="search-inline"><Icon name="search" size={14} color="var(--ink-faint)"/><input placeholder="Search students by name, email…" value={q} onChange={e=>setQ(e.target.value)}/></div>
        <select className="select-field" value={inst} onChange={e=>setInst(e.target.value)}>
          <option value="All">All Institutions</option>
          {institutions.map(i=> <option key={i.id} value={i.short}>{i.short} — {i.name}</option>)}
        </select>
        <select className="select-field" value={dept} onChange={e=>setDept(e.target.value)}>
          <option value="All">All Departments</option>
          {uniqueDepartments.map(d=> <option key={d} value={d}>{d}</option>)}
        </select>
        <select className="select-field" value={risk} onChange={e=>{ setRisk(e.target.value); if(setFilterRisk) setFilterRisk("All"); }}>
          <option value="All">All Risk Levels</option>
          <option value="Low">Low Risk (75+)</option>
          <option value="Medium">Medium Risk (55–74)</option>
          <option value="High">High Risk (&lt;55)</option>
        </select>
        <div style={{flex:1}}></div>
        <span style={{fontSize:11.5,color:"var(--ink-faint)"}}>Sorted by <strong>{sortKey}</strong> ({sortDir})</span>
      </div>

      <SectionCard title="Student performance records" sub="Click any column header to sort, click student name for details">
        {students.length === 0 ? (
          <div className="empty-state" style={{padding:"60px 20px"}}>
            <Icon name="users" size={36}/>
            <div className="empty-title">No students available yet</div>
            <div>Upload a CSV batch or onboard candidates to view records.</div>
          </div>
        ) : rows.length === 0 ? (
          <div className="empty-state" style={{padding:"40px 20px"}}>
            <Icon name="search" size={32}/>
            <div className="empty-title">No students match these filters</div>
            <div>Try widening your search criteria or resetting filters.</div>
          </div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("name")}>Student{sortIcon("name")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("institution")}>Inst.{sortIcon("institution")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("department")}>Dept.{sortIcon("department")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("aptitude")}>Aptitude{sortIcon("aptitude")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("coding")}>Coding{sortIcon("coding")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("communication")}>Comm.{sortIcon("communication")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("resume")}>Resume{sortIcon("resume")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("interview")}>Interview{sortIcon("interview")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("readiness")}>Readiness{sortIcon("readiness")}</th>
                  <th style={{cursor:"pointer"}} onClick={()=>toggleSort("risk")}>Risk{sortIcon("risk")}</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {rows.slice(0,50).map(s=>(
                  <tr key={s.id}>
                    <td>
                      <div className="row-user" onClick={()=>onSelectStudent(s)}>
                        <div className="avatar-sm" style={{background:instColor(s.institution)}}>{initials(s.name)}</div>
                        <div><div className="row-user-name">{s.name}</div><div className="row-user-sub">{s.year}</div></div>
                      </div>
                    </td>
                    <td><span className="mono" style={{fontWeight:600}}>{s.institution}</span></td>
                    <td style={{fontSize:12.5}}>{s.department}</td>
                    <td className="cell-mono">{s.aptitude || 0}</td>
                    <td className="cell-mono">{s.coding || 0}</td>
                    <td className="cell-mono">{s.communication || 0}</td>
                    <td className="cell-mono">{s.resume || 0}%</td>
                    <td>{statusPill(s.interview)}</td>
                    <td>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <Gauge score={s.readiness || 0} size={28} stroke={4} showLabel={false}/>
                        <span className="cell-mono">{s.readiness || 0}</span>
                      </div>
                    </td>
                    <td>{riskPill(s.risk)}</td>
                    <td>
                      <div style={{display:"flex",gap:6}}>
                        <button className="btn btn-ghost btn-sm" title="Assign Mentor" onClick={()=>toast(`Mentor assigned to ${s.name}.`)}><Icon name="user-check" size={13}/></button>
                        <button className="btn btn-ghost btn-sm" title="Notify TPO" onClick={()=>toast(`TPO notified about ${s.name}.`)}><Icon name="mail" size={13}/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </SectionCard>
    </div>
  );
}

                      <td>{risk>0 ? <Pill kind="bad">{risk} students</Pill> : <Pill kind="good">None</Pill>}</td>
                    </tr>
                  );
                })}

            </table>
          </div>
        )}

    </div>
  );
}

function AssessmentsView({assessments = [], openModal, studyModules = [], setStudyModules}){
  const toast = useToast();
  const [tab,setTab] = useState("All");
  const types = ["All","Aptitude Test","Coding Challenge","Mock Test","Communication"];
  const rows = assessments.filter(a=> tab==="All"||a.type===tab);

  // Study Material Upload Form State
  const fileInputRef = useRef(null);
  const [selectedFile, setSelectedFile] = useState(null);
  const [docName, setDocName] = useState("");
  const [mainTopic, setMainTopic] = useState("Quantitative Aptitude / Mathematics");
  const [uploading, setUploading] = useState(false);

  // Search & Filter State for Uploaded Study Materials
  const [searchQuery, setSearchQuery] = useState("");
  const [topicFilter, setTopicFilter] = useState("All Topics");

  const TOPIC_OPTIONS = [
    "Quantitative Aptitude / Mathematics",
    "Logical & Analytical Reasoning",
    "Verbal Ability / English",
    "Data Interpretation",
    "General Knowledge & Current Affairs",
    "Computer & IT Fundamentals",
    "Subject/Technical Knowledge",
    "Research & Academic Aptitude",
    "Communication & Employability Skills"
  ];

  const handleFileChange = (e) => {
    const file = e.target.files?.[0];
    if (file) {
      setSelectedFile(file);
      if (!docName.trim()) {
        const rawName = file.name.replace(/\.[^/.]+$/, "");
        setDocName(rawName);
      }
    }
  };

  const handleUploadStudyMaterial = async () => {
    if (!selectedFile) {
      toast("Please select a document file to upload.");
      return;
    }
    if (!docName.trim()) {
      toast("Please enter a document name.");
      return;
    }
    if (!mainTopic) {
      toast("Please select a main topic.");
      return;
    }

    setUploading(true);

    try {
      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Data = event.target.result;
        const newId = "sm_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        const metadata = {
          file_name: selectedFile.name,
          file_size: selectedFile.size,
          file_type: selectedFile.type || "application/octet-stream",
          main_topic: mainTopic,
          file_data: base64Data,
          uploaded_at: new Date().toISOString()
        };

        const dbRecord = {
          id: newId,
          title: docName.trim(),
          subject: mainTopic,
          description: JSON.stringify(metadata),
          created_at: new Date().toISOString()
        };

        if (supabase) {
          try {
            const { error } = await supabase.from("study_modules").insert([dbRecord]);
            if (error) {
              console.warn("Supabase study_modules insert:", error.message);
            }
          } catch(e) {
            console.warn("Supabase insert error:", e);
          }
        }

        const newModuleItem = {
          id: newId,
          title: docName.trim(),
          subject: mainTopic,
          fileName: selectedFile.name,
          fileSize: selectedFile.size,
          fileType: selectedFile.type || "Document",
          fileData: base64Data,
          createdAt: new Date().toLocaleDateString("en-GB", {day:"2-digit",month:"short",year:"numeric"})
        };

        if (setStudyModules) {
          setStudyModules(prev => {
            const updated = [newModuleItem, ...prev];
            localStorage.setItem("placed_study_modules", JSON.stringify(updated));
            return updated;
          });
        }

        setSelectedFile(null);
        setDocName("");
        if (fileInputRef.current) fileInputRef.current.value = "";
        setUploading(false);
        toast("Study material uploaded successfully.");
      };

      reader.readAsDataURL(selectedFile);
    } catch(err) {
      setUploading(false);
      toast("Upload failed: " + err.message);
    }
  };

  const handleDeleteStudyMaterial = async (item) => {
    if (supabase) {
      try {
        await supabase.from("study_modules").delete().eq("id", item.id);
      } catch(e){}
    }
    if (setStudyModules) {
      setStudyModules(prev => {
        const updated = prev.filter(x => x.id !== item.id);
        localStorage.setItem("placed_study_modules", JSON.stringify(updated));
        return updated;
      });
    }
    toast(`Deleted "${item.title}".`);
  };

  const handleDownloadFile = (item) => {
    if (item.fileData) {
      const link = document.createElement("a");
      link.href = item.fileData;
      link.download = item.fileName || (item.title + ".pdf");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      toast(`Viewing / Downloading "${item.title}"`);
    } else {
      toast(`Viewing document "${item.title}"`);
    }
  };

  const filteredStudyMaterials = (studyModules || []).filter(item => {
    const matchesTopic = topicFilter === "All Topics" || item.subject === topicFilter;
    const matchesSearch = !searchQuery.trim() || 
      (item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase().trim())) ||
      (item.fileName && item.fileName.toLowerCase().includes(searchQuery.toLowerCase().trim()));
    return matchesTopic && matchesSearch;
  });

  const formatFileSize = (bytes) => {
    if (!bytes || bytes === 0) return "—";
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  };

  return (
    <div>
      <div className="page-head">
        <div><div className="page-title">Upload</div><div className="page-desc">Assessment management & study material document repository</div></div>
        <button className="btn btn-primary" onClick={()=>openModal("assessment")}><Icon name="plus" size={15} color="#fff"/> Create assessment</button>
      </div>

      {/* 1. EXISTING ASSESSMENT BOX (100% UNCHANGED) */}
      <div className="tabs">
        {types.map(t=> <button key={t} className={"tab-btn"+(tab===t?" active":"")} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      {rows.length === 0 ? (
        <div className="card" style={{marginBottom:24}}>
          <div className="empty-state" style={{padding:"50px 20px"}}>
            <Icon name="check-sq" size={36}/>
            <div className="empty-title">No assessments available yet</div>
            <div>Create an assessment or mock test to begin evaluating candidate performance.</div>
          </div>
        </div>
      ) : (
        <div className="grid" style={{gridTemplateColumns:"repeat(2,1fr)",gap:16,marginBottom:24}}>
          {rows.map((a,i)=>(
            <div className="card" key={a.id||i}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>{a.name}</div>
                  <div className="row-user-sub" style={{marginTop:2}}>{a.type} · {a.date} · {a.duration || 60} mins</div>
                </div>
                <Pill kind="neutral">{a.type}</Pill>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
                <div className="progress-track" style={{flex:1}}><div className="progress-fill" style={{width:(a.completion||0)+"%",background:bandColor(a.completion||0)}}></div></div>
                <span className="cell-mono" style={{fontSize:11.5}}>{a.completion || 0}%</span>
              </div>
              <div className="row-user-sub" style={{marginBottom:12}}>Completion rate · avg cohort score <span className="cell-mono" style={{color:"var(--ink)",fontWeight:700}}>{a.avg || 0}</span></div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-ghost btn-sm" onClick={()=>toast(`Viewing results for "${a.name}".`)}>View results</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>toast(`Reminder sent to candidates for "${a.name}".`)}>Send reminder</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* 2. NEW SECOND BOX: UPLOAD STUDY MATERIAL */}
      <SectionCard 
        title="Upload Study Material" 
        sub="Upload documents directly to study_module repository"
        style={{marginBottom:24}}
      >
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            <div>
              <label className="field-label">Select Document <span style={{color:"var(--brand)",fontWeight:600}}>(PDF, DOCX, PPTX, TXT)</span></label>
              <input 
                type="file" 
                ref={fileInputRef} 
                onChange={handleFileChange} 
                className="field-input"
                style={{padding:"8px 12px",cursor:"pointer"}}
                accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.csv,.xlsx"
              />
              {selectedFile && (
                <div style={{fontSize:12,color:"var(--ink-soft)",marginTop:6,display:"flex",alignItems:"center",gap:6}}>
                  <Icon name="check" size={14} color="var(--good)"/> File: <strong>{selectedFile.name}</strong> ({formatFileSize(selectedFile.size)})
                </div>
              )}
            </div>

            <div>
              <label className="field-label">Document / Study Material Name</label>
              <input 
                className="field-input" 
                placeholder="e.g. Number System 1" 
                value={docName} 
                onChange={e=>setDocName(e.target.value)}
              />
            </div>
          </div>

          <div>
            <label className="field-label">Main Topic</label>
            <select className="field-input" value={mainTopic} onChange={e=>setMainTopic(e.target.value)}>
              {TOPIC_OPTIONS.map(opt => (
                <option key={opt} value={opt}>{opt}</option>
              ))}
            </select>
          </div>

          <div style={{display:"flex",justifyContent:"flex-start",marginTop:4}}>
            <button className="btn btn-brand" onClick={handleUploadStudyMaterial} disabled={uploading}>
              <Icon name="upload" size={15} color="#fff"/> {uploading ? "Uploading to study_module..." : "Upload"}
            </button>
          </div>
        </div>
      </SectionCard>

      {/* 3. DOCUMENT LIST / VIEW SECTION: UPLOADED STUDY MATERIALS */}
      <SectionCard 
        title="Uploaded Study Materials" 
        sub="Study documents currently stored in study_module"
        right={
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{position:"relative",display:"flex",alignItems:"center"}}>
              <input 
                className="field-input" 
                placeholder="Search documents by name..." 
                value={searchQuery} 
                onChange={e=>setSearchQuery(e.target.value)}
                style={{padding:"6px 12px 6px 30px",fontSize:12.5,width:240}}
              />
              <span style={{position:"absolute",left:10,top:7,pointerEvents:"none"}}>
                <Icon name="search" size={14} color="var(--ink-faint)"/>
              </span>
              {searchQuery && (
                <button 
                  onClick={()=>setSearchQuery("")} 
                  style={{position:"absolute",right:8,background:"none",border:"none",cursor:"pointer",color:"var(--ink-faint)"}}
                  title="Clear search"
                >
                  <Icon name="x" size={12}/>
                </button>
              )}
            </div>

            <select 
              className="field-input" 
              value={topicFilter} 
              onChange={e=>setTopicFilter(e.target.value)}
              style={{padding:"6px 12px",fontSize:12.5,width:250}}
            >
              <option value="All Topics">All Topics</option>
              {TOPIC_OPTIONS.map(opt => (
                <option key={opt} value={opt}>{opt}</option>
              ))}
            </select>
          </div>
        }
      >
        {filteredStudyMaterials.length === 0 ? (
          <div className="empty-state" style={{padding:"50px 20px"}}>
            <Icon name="file" size={36}/>
            <div className="empty-title">
              {searchQuery || topicFilter !== "All Topics" ? "No matching study materials found" : "No study materials uploaded yet"}
            </div>
            <div style={{fontSize:12.5}}>
              {searchQuery || topicFilter !== "All Topics" ? "Try adjusting your search term or topic filter." : "Upload study documents using the form above to populate the repository."}
            </div>
          </div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Document Name</th>
                  <th>Main Topic</th>
                  <th>File Details</th>
                  <th>Upload Date</th>
                  <th style={{textAlign:"right"}}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filteredStudyMaterials.map((item, idx) => (
                  <tr key={item.id || idx}>
                    <td>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={{width:32,height:32,borderRadius:8,background:"var(--brand-soft)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--brand)",flexShrink:0}}>
                          <Icon name="file" size={16}/>
                        </div>
                        <div>
                          <div className="cell-strong" style={{fontSize:13}}>{item.title}</div>
                          <div className="row-user-sub" style={{fontSize:11}}>{item.fileName}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <span className="pill pill-brand" style={{fontSize:11,fontWeight:600,padding:"4px 10px",whiteSpace:"nowrap"}}>
                        {item.subject}
                      </span>
                    </td>
                    <td>
                      <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                        {formatFileSize(item.fileSize)}
                      </div>
                    </td>
                    <td>
                      <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                        {item.createdAt}
                      </div>
                    </td>
                    <td style={{textAlign:"right"}}>
                      <div style={{display:"inline-flex",gap:6}}>
                        <button 
                          className="btn btn-ghost btn-sm" 
                          onClick={()=>handleDownloadFile(item)}
                          title="Open / Download Document"
                        >
                          <Icon name="download" size={13}/> View/Open
                        </button>
                        <button 
                          className="btn btn-ghost btn-sm" 
                          onClick={()=>handleDeleteStudyMaterial(item)}
                          style={{color:"var(--bad)",borderColor:"rgba(239,68,68,0.2)"}}
                          title="Delete Study Material"
                        >
                          <Icon name="x" size={13} color="var(--bad)"/> Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </SectionCard>
    </div>
  );
}
